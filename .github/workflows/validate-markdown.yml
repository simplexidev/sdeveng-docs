name: Validate Markdown

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve validation evidence for every push and PR run.
concurrency:
  group: markdown-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Markdown Rules
        shell: bash
        run: |
          # Existing human docs use wrapped prose without a fixed line limit.
          # Keep other default rules enabled; export fixes without pushing from CI.
          cat > "$RUNNER_TEMP/.markdownlint-cli2.jsonc" <<'JSON'
          {
            "config": {
              "default": true,
              "MD013": false
            },
            "fix": true
          }
          JSON

      - name: Format Markdown
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: ${{ runner.temp }}/.markdownlint-cli2.jsonc
          globs: '**/*.md'
          fix: true

      - name: Export Formatting Patch
        id: formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --binary -- '*.md' > "$RUNNER_TEMP/markdown-format.patch"
          if [[ -s "$RUNNER_TEMP/markdown-format.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Formatting Patch
        if: ${{ !cancelled() && steps.formatting.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Markdown Formatting Patch
          path: ${{ runner.temp }}/markdown-format.patch
          if-no-files-found: error
          retention-days: 7

      - name: Require Committed Formatting
        if: ${{ !cancelled() && steps.formatting.outputs.changed == 'true' }}
        shell: bash
        run: |
          echo "::error::Markdown needs formatting. Download the Markdown Formatting Patch artifact, apply it with git apply, then commit and push the changes."
          exit 1

      - name: Check Local Links and Anchors
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --no-progress
            --root-dir "${{ github.workspace }}" './**/*.md'
          output: ${{ runner.temp }}/markdown-links.md
          fail: true
          failIfEmpty: true

      - name: Check Diff Whitespace
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            # Initial pushes and manual runs may not provide an existing base.
            git show --format= --check HEAD
          fi
